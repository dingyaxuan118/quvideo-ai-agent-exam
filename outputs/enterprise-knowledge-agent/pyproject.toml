[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-agent"
version = "1.0.0"
description = "A guarded ReAct agent for enterprise knowledge Q&A"
requires-python = ">=3.10"
dependencies = ["openai>=2.0.0,<3", "pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[project.scripts]
knowledge-agent = "knowledge_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
