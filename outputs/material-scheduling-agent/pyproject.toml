[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-scheduling-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openai>=2.0.0,<3", "pydantic>=2.8,<3"]

[project.scripts]
material-agent = "material_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
