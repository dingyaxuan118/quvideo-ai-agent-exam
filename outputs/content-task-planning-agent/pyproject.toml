[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-task-planning-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["openai>=2.0.0,<3", "pydantic>=2.8,<3"]

[project.scripts]
content-planner = "content_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
